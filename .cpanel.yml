---
deployment:
  tasks:
    - export DEPLOYPATH=/home/Ysgvihssc/public_html/
    - export APPPATH=/home/Ysgvihssc/qrattendance/
    - /bin/mkdir -p $APPPATH
    - /bin/cp -R app $APPPATH
    - /bin/cp -R bootstrap $APPPATH
    - /bin/cp -R config $APPPATH
    - /bin/cp -R database $APPPATH
    - /bin/cp -R resources $APPPATH
    - /bin/cp -R routes $APPPATH
    - /bin/cp -R storage $APPPATH
    - /bin/cp -R vendor $APPPATH
    - /bin/cp artisan $APPPATH
    - /bin/cp composer.json $APPPATH
    - /bin/cp composer.lock $APPPATH
    - /bin/cp package.json $APPPATH
    - if [ ! -f $APPPATH/.env ]; then /bin/cp .env.example $APPPATH/.env; fi
    - /bin/cp -R public/* $DEPLOYPATH
    - /bin/cp public/.htaccess $DEPLOYPATH
    - /bin/sed -i "s|__DIR__.'/../vendor/autoload.php'|'/home/Ysgvihssc/qrattendance/vendor/autoload.php'|g" $DEPLOYPATH/index.php
    - /bin/sed -i "s|__DIR__.'/../bootstrap/app.php'|'/home/Ysgvihssc/qrattendance/bootstrap/app.php'|g" $DEPLOYPATH/index.php
    - cd $APPPATH && composer install --no-dev --optimize-autoloader --no-interaction
    - cd $APPPATH && php artisan config:clear
    - cd $APPPATH && php artisan route:clear
    - cd $APPPATH && php artisan view:clear
    - cd $APPPATH && php artisan cache:clear
    - cd $APPPATH && php artisan config:cache
    - cd $APPPATH && php artisan route:cache
    - cd $APPPATH && php artisan view:cache
    - /bin/rm -rf $DEPLOYPATH/storage
    - /bin/ln -sf $APPPATH/storage/app/public $DEPLOYPATH/storage
    - /bin/chmod -R 755 $APPPATH/storage
    - /bin/chmod -R 755 $APPPATH/bootstrap/cache
    - /bin/chmod 644 $DEPLOYPATH/.htaccess


